# Runs the command in _RUN on a Cloud Build private pool and keeps its TestResults. scripts/pool.sh submits it.
steps:
  - name: mcr.microsoft.com/dotnet/sdk:11.0
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      # shortcut: downloads SDK 10 on every build, bake an image once the download shows in the timings.
      curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir /usr/share/dotnet
      export PATH="$PATH:$HOME/.dotnet/tools"
      # The SDK image sets it to skip, so packages come without XML docs, and a build that compares a file made from
      # those docs with the one in its repo then fails. A CI runner extracts them.
      unset NUGET_XMLDOC_MODE
      # The GCS tests' bucket, made by scripts/pool-setup.sh.
      export MIDA_TEST_BUCKET="$PROJECT_ID-mida-test"
      # The next step keeps TestResults whatever this exits with, then exits with it.
      bash -ec "$_RUN" || echo $? > .exit-code
  - name: gcr.io/cloud-builders/gcloud
    script: |
      #!/usr/bin/env bash
      set -eo pipefail
      if [ -d TestResults ]; then
        gcloud storage cp -r TestResults "gs://$PROJECT_ID-mida-builds/results/$BUILD_ID/"
      fi
      exit "$(cat .exit-code 2> /dev/null || echo 0)"
# No timeout here: scripts/pool.sh passes one for each job.
# A push and a real-world dispatch queue some 14 builds, more than the pool runs at once, and a build waits for a
# worker for an hour by default. Five hours, under the six a GitHub job may wait for it.
queueTtl: 18000s
options:
  # Puts _RUN, PROJECT_ID and BUILD_ID in the scripts' environment.
  automapSubstitutions: true
  # The build's account writes its log to the bucket that scripts/pool.sh names, where gcloud streams it from.
  logging: GCS_ONLY
