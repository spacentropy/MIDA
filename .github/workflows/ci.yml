name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The net10.0 run builds its fixtures with SDK 10, since that build of mida cannot load SDK 11.
          dotnet-version: 10.0.x
          global-json-file: global.json
      - run: dotnet test --project tests/Mida.Tests -f ${{ matrix.framework }}
