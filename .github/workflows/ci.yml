name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # The net10.0 run builds its fixtures with SDK 10, since that build of mida cannot load SDK 11.
          dotnet-version: 10.0.x
          global-json-file: global.json
      - run: dotnet test --project tests/Mida.Tests -f ${{ matrix.framework }}
