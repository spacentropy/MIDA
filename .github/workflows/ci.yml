name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        framework: [net10.0, net11.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The net10.0 run builds its fixtures with SDK 10, since that build of mida cannot load SDK 11.
          dotnet-version: 10.0.x
          global-json-file: global.json
      # The GCS tests start fake-gcs-server in Docker, which only the Linux runners have. They skip elsewhere.
      - run: dotnet test --project tests/Mida.Tests -f ${{ matrix.framework }}
