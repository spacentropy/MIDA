name: Real world

# Builds other people's repos, so it runs only when asked.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realworld:
    strategy:
      fail-fast: false
      matrix:
        # Tests of tests/Mida.Tests/RealWorld.cs. Each clones one repo at a pinned tag and builds it four times, or for
        # OrchardCoreTests and McpTests, tests it three times.
        repo: [OrchardCore, Abp, OrchardCoreTests, McpTests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Both repos target net10.0. Abp pins SDK 10, and OrchardCore rolls forward to the newest SDK installed.
          dotnet-version: 10.0.x
          global-json-file: global.json
      # The packed tool, installed the way a user installs it. On .NET 11, which loads either SDK.
      - run: |
          dotnet pack src/Mida -c Release -p:Version=0.0.0-realworld -o out
          dotnet tool install -g mida --version 0.0.0-realworld --add-source out --framework net11.0
      # A built checkout of mcp is 26 GB, mostly packages copied into each test project's bin, so the checkouts go on
      # the larger disk.
      - run: sudo mkdir -p /mnt/tmp && sudo chown "$USER" /mnt/tmp && df -h / /mnt
      - run: dotnet test --project tests/Mida.Tests -f net11.0 --treenode-filter "/*/*/RealWorld/${{ matrix.repo }}" --output Detailed
        env:
          MIDA_BENCH_TOOL: mida
          TMPDIR: /mnt/tmp
      - if: always()
        run: cat TestResults/realworld-*.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realworld-${{ matrix.repo }}
          path: TestResults/realworld-*
