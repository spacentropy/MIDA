name: Real world

# Builds other people's repos, so it runs only when asked.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: The tests to run, a JSON list.
        default: '["OrchardCore", "Abp", "Aspire", "OrchardCoreTests", "McpTests"]'
      pool:
        description: The worker pool, mida-8 with 8 processors, which mida is tuned for, or mida with 22.
        default: mida-8

permissions:
  contents: read
  # Signs in to Google Cloud, which runs the builds.
  id-token: write

jobs:
  realworld:
    strategy:
      fail-fast: false
      matrix:
        # Tests of tests/Mida.Tests/RealWorld.cs. Each clones one repo at a pinned tag and builds it, or for
        # OrchardCoreTests and McpTests tests it, plain, with mida and an empty cache, and with a filled one, three
        # times each under BenchmarkDotNet.
        repo: ${{ fromJSON(inputs.repos) }}
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits: a moved tag would run in a job that can sign in to Google Cloud.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On the pool, which has SDK 10 beside SDK 11: Abp and mcp pin SDK 10, OrchardCore rolls forward to the newest
      # SDK installed, and Aspire pins 11.0.100. The packed tool is installed the way a user installs it, on .NET 11,
      # which loads either SDK. Its checkouts and caches are under /tmp.
      - uses: ./.github/actions/pool
        with:
          project: ${{ secrets.GCP_PROJECT }}
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Three runs of each of three builds of the biggest repo, where one round took 19 minutes on a hosted runner.
          timeout: 10800s
          pool: ${{ inputs.pool }}
          run: |
            dotnet pack src/Mida -c Release -p:Version=0.0.0-realworld -o out
            dotnet tool install -g mida --version 0.0.0-realworld --add-source out --framework net11.0
            MIDA_BENCH_TOOL=mida dotnet test --project tests/Mida.Tests -f net11.0 --treenode-filter "/*/*/RealWorld/${{ matrix.repo }}" --output Detailed
      - if: always()
        run: cat TestResults/realworld-*.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realworld-${{ matrix.repo }}
          path: TestResults/realworld-*
