name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to commits: a moved tag would run in a workflow that can publish.
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      # The tag without its v is the package version: v0.1.0 publishes 0.1.0.
      - run: dotnet pack src/Mida -c Release -p:Version=${GITHUB_REF_NAME#v} -o out
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: out/*.nupkg
          if-no-files-found: error
  # Apart from pack, so no code from the repo or its packages runs in the job that can sign in to nuget.org.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    # Waits for an approval. The trusted publishing policy on nuget.org names this environment.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
      # Trades the job's GitHub identity for a nuget.org key that lasts an hour, so the repo stores no key.
      - id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # The runner's own dotnet: there is no checkout here, so no global.json to satisfy.
      - run: dotnet nuget push ./*.nupkg --api-key "$KEY" --source https://api.nuget.org/v3/index.json
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
